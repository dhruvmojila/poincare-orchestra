[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "poincare-orchestra"
version = "0.1.0"
description = "Scenario-first reference implementation of 'LLM Orchestration with Geometry-Aware Memory' (IEEE ICBDML 2026): metacognitive controller, provider-agnostic ensemble with throttling detection, multi-objective synthesis, on top of poincare-memory."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Dhruv Mojila", email = "dhruvmojila098@gmail.com" }]
keywords = ["llm orchestration", "multi-agent", "agent memory", "hyperbolic embeddings", "metacognition", "ensemble", "retrieval-augmented generation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = ["poincare-memory>=0.1.0", "pydantic>=2.5", "numpy>=1.24"]

[project.optional-dependencies]
litellm = ["litellm>=1.40"]
yaml = ["pyyaml>=6"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
  "twine>=5",
  "pyyaml>=6",
  "types-PyYAML",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]

[project.urls]
Homepage = "https://github.com/dhruvmojila/poincare-orchestra"
Documentation = "https://dhruvmojila.github.io/poincare-orchestra"
Repository = "https://github.com/dhruvmojila/poincare-orchestra"
Issues = "https://github.com/dhruvmojila/poincare-orchestra/issues"
Paper = "https://doi.org/10.1109/ICBDML68582.2026.11544690"
Memory = "https://github.com/dhruvmojila/poincare-memory"

[project.scripts]
poincare-orchestra = "poincare_orchestra.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/poincare_orchestra"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["site", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
