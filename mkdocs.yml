site_name: poincare-orchestra
site_description: Scenario-first reference implementation of "LLM Orchestration with Geometry-Aware Memory" (IEEE ICBDML 2026) on top of poincare-memory.
site_url: https://dhruvmojila.github.io/poincare-orchestra/
repo_url: https://github.com/dhruvmojila/poincare-orchestra
repo_name: dhruvmojila/poincare-orchestra
edit_uri: edit/main/docs/
copyright: "© 2026 Dhruv Mojila · Apache-2.0"
strict: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Scenarios: scenarios.md
  - Controller: controller.md
  - Ensemble: ensemble.md
  - Synthesis: synthesis.md
  - Evaluation: evaluation.md
  - CLI: cli.md
  - API reference: api.md
  - Paper mapping: paper-mapping.md
  - FAQ: faq.md
  - Changelog: changelog.md

theme:
  name: material
  features:
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            show_if_no_docstring: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dhruvmojila/poincare-orchestra
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/poincare-orchestra/
    - icon: fontawesome/solid/book
      link: https://doi.org/10.1109/ICBDML68582.2026.11544690
