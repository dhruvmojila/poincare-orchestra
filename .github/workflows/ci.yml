name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install poincare-memory (PyPI, else the GitHub repository)
        env:
          POINCARE_MEMORY_TOKEN: ${{ secrets.POINCARE_MEMORY_TOKEN }}
        run: |
          python -m pip install "poincare-memory>=0.1.0" 2>/dev/null \
            || python -m pip install "poincare-memory @ git+https://${POINCARE_MEMORY_TOKEN:+${POINCARE_MEMORY_TOKEN}@}github.com/dhruvmojila/poincare-memory.git@main"
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install poincare-memory (PyPI, else the GitHub repository)
        env:
          POINCARE_MEMORY_TOKEN: ${{ secrets.POINCARE_MEMORY_TOKEN }}
        run: |
          python -m pip install "poincare-memory>=0.1.0" 2>/dev/null \
            || python -m pip install "poincare-memory @ git+https://${POINCARE_MEMORY_TOKEN:+${POINCARE_MEMORY_TOKEN}@}github.com/dhruvmojila/poincare-memory.git@main"
      - run: uv pip install --system -e ".[docs,yaml]"
      - run: mkdocs build --strict
